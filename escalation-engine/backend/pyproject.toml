[tool.poetry]
name = "cittaa-escalation-engine"
version = "1.0.0"
description = "CITTAA Internal Escalation AI Engine System for Mental Health Case Management"
authors = ["CITTAA Health Services <info@cittaa.in>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = {extras = ["standard"], version = "^0.109.0"}
fastapi-cli = "^0.0.2"
uvicorn = {extras = ["standard"], version = "^0.29.0"}
python-multipart = "^0.0.6"
sqlalchemy = "^2.0.25"
psycopg2-binary = "^2.9.9"
pyjwt = "^2.8.0"
bcrypt = "^4.1.2"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
pydantic = "^2.5.3"
pydantic-settings = "^2.1.0"
python-dotenv = "^1.0.0"
httpx = "^0.26.0"
email-validator = "^2.0.0"
celery = {extras = ["redis"], version = "^5.3.6"}
redis = "^5.0.1"
sendgrid = "^6.11.0"
reportlab = "^4.0.8"
cryptography = "^41.0.7"
spacy = "^3.7.2"
scikit-learn = "^1.4.0"
numpy = "^1.26.3"
transformers = "^4.36.2"
torch = "^2.1.2"
aiofiles = "^23.2.1"
boto3 = "^1.34.14"
prometheus-client = "^0.19.0"
pymongo = {extras = ["srv"], version = "^4.6.1"}

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.4"
pytest-asyncio = "^0.23.3"
black = "^23.12.1"
isort = "^5.13.2"
flake8 = "^7.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
